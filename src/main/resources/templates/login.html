<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DadoLivre - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { color: #0d6efd; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #0d6efd; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #0b5ed7; }
        .error { color: red; margin-bottom: 15px; font-size: 14px; text-align: center; }
        .footer-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .footer-link a { color: #0d6efd; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🗳️ DadoLivre</h2>
        
        <div th:if="${param.error}" class="error">
            E-mail ou senha inválidos!
        </div>

        <form action="/perform_login" method="POST">
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" name="email" required placeholder="Digite seu e-mail">
            </div>
            <div class="form-group">
                <label>Senha:</label>
                <input type="password" name="senha" required placeholder="Sua senha">
            </div>
            <button type="submit">Entrar</button>
        </form>
        
        <div class="footer-link">
            <p>Não tem conta? <a href="/dadolivre/cad">Cadastre-se</a></p>
            <p><a href="/">Voltar à Página Inicial</a></p>
        </div>
    </div>
</body>
</html>
