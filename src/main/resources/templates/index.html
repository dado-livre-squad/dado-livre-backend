<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DadoLivre - Pesquisa de Candidatos</title>
    <!-- Bootstrap CSS para estilização rápida -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🗳️ DadoLivre</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold">Pesquisa de Candidatos Eleitorais</h1>
            <p class="text-muted">Consulte propostas, partidos e informações de forma transparente.</p>
        </div>

        <!-- Barra de Busca (RF04) -->
        <div class="row justify-content-center mb-5">
            <div class="col-md-8">
                <form action="/buscar" method="get" class="input-group shadow-sm">
                    <input type="text" name="nome" class="form-control form-control-lg" placeholder="Digite o nome do candidato ou partido...">
                    <button class="btn btn-primary px-4" type="submit">Pesquisar</button>
                </form>
            </div>
        </div>

        <!-- Cards de Candidatos (RF01) -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Exemplo estático/dinâmico com Thymeleaf -->
            <div class="col">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <span class="badge bg-secondary mb-2">PARTIDO A</span>
                        <h5 class="card-title fw-bold">Nome do Candidato</h5>
                        <p class="card-text text-muted mb-1">Cargo: Prefeito</p>
                        <p class="card-text text-muted small">São Paulo - SP</p>
                        <a href="#" class="btn btn-outline-primary btn-sm mt-3 w-100">Ver Perfil Completo</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
