<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DadoLivre - Cadastro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { color: #0d6efd; text-align: center; margin-top: 0; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #0d6efd; outline: none; }
        button { background-color: #0d6efd; color: white; padding: 12px; border: none; border-radius: 4px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        button:hover { background-color: #0b5ed7; }
        .footer-links { text-align: center; margin-top: 20px; font-size: 14px; }
        .footer-links a { color: #0d6efd; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }
        .erro { color: red; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🗳️ DadoLivre - Cadastro</h2>

    <form id="cadastroForm">
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" required placeholder="Seu nome completo">
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" required placeholder="seu@email.com">
        </div>

        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" required placeholder="Crie uma senha">
        </div>

        <!-- ✅ CORRIGIDO: removido o select de tipoUsuario -->
        <!-- O backend sempre define o tipo como ELEITOR automaticamente -->

        <button type="submit">Cadastrar</button>
        <p class="erro" id="msgErro"></p>
    </form>

    <div class="footer-links">
        <p>Já possui conta? <a href="/dadolivre/login">Faça Login</a></p>
        <p><a href="/">Voltar para a Página Inicial</a></p>
    </div>
</div>

<script>
    document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const msgErro = document.getElementById('msgErro');
        msgErro.style.display = 'none';

        const dados = {
            nome:  document.getElementById('nome').value,
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value
            // tipoUsuario não é enviado — o backend define como ELEITOR
        };

        try {
            const response = await fetch('/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (response.ok) {
                alert('Cadastro realizado com sucesso! 🎉');
                window.location.href = '/dadolivre/login';
            } else if (response.status === 409) {
                msgErro.textContent = 'Este e-mail já está cadastrado.';
                msgErro.style.display = 'block';
            } else {
                msgErro.textContent = 'Erro ao cadastrar. Verifique os dados e tente novamente.';
                msgErro.style.display = 'block';
            }
        } catch (error) {
            console.error('Erro de conexão:', error);
            msgErro.textContent = 'Não foi possível conectar ao servidor.';
            msgErro.style.display = 'block';
        }
    });
</script>

</body>
</html>
